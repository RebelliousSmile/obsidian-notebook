name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  path: handbook

            - name: Use pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"

            - name: Install dependencies
              working-directory: handbook
              run: pnpm install --frozen-lockfile

            - name: Check Handbook
              working-directory: handbook
              run: pnpm run check
